name: Build CaptionForge APK
on:
  push:
    paths: ['captionforge/**', '.github/workflows/captionforge-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: captionforge
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Save installable APK to repository
        if: success()
        run: |
          cp captionforge/app/build/outputs/apk/debug/app-debug.apk CaptionForge-debug.apk
          git config user.name "CaptionForge Builder"
          git config user.email "builder@users.noreply.github.com"
          git add -f CaptionForge-debug.apk
          git commit -m "Package CaptionForge APK [skip ci]"
          git push origin "$GITHUB_REF_NAME"
      - name: Publish compiler diagnostics
        if: failure()
        working-directory: captionforge
        run: grep -A 24 -B 2 -E 'FAILURE:|What went wrong|error:' build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CaptionForge-APK
          path: |
            captionforge/app/build/outputs/apk/debug/app-debug.apk
            captionforge/build.log
