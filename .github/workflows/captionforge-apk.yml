name: Build CaptionForge APK
on:
  push:
    paths: ['captionforge/**', '.github/workflows/captionforge-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: captionforge
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Publish compiler diagnostics
        if: failure()
        working-directory: captionforge
        run: tail -35 build.log | while IFS= read -r line; do echo "::error::${line//%/}%25"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CaptionForge-APK
          path: |
            captionforge/app/build/outputs/apk/debug/app-debug.apk
            captionforge/build.log
